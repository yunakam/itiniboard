spring:
  datasource:
    url: jdbc:mysql://localhost:3306/itiniboard?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo
    username: itiniboard_app
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
